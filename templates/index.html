<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hybrid Attendance System</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      /* Header */

      header {
        background: #0f172a;
        color: white;
        padding: 20px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        font-size: 24px;
      }

      header span {
        font-size: 14px;
        color: #94a3b8;
      }

      /* Main container */

      .container {
        width: 90%;
        max-width: 1200px;
        margin: 30px auto;
      }

      /* Cards */

      .cards {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

        gap: 20px;

        margin-bottom: 30px;
      }

      .card {
        background: white;

        padding: 25px;

        border-radius: 12px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        font-size: 14px;

        color: #64748b;

        margin-bottom: 10px;
      }

      .card p {
        font-size: 26px;

        font-weight: bold;
      }

      /* Status */

      .verified {
        color: #16a34a;
      }

      .not-verified {
        color: #dc2626;
      }

      /* Attendance table */

      .table-container {
        background: white;

        padding: 25px;

        border-radius: 12px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

        overflow-x: auto;
      }

      .table-container h2 {
        margin-bottom: 20px;
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px;

        text-align: left;

        border-bottom: 1px solid #e5e7eb;
      }

      th {
        background: #f8fafc;

        color: #475569;
      }

      .status {
        color: #16a34a;

        font-weight: bold;
      }

      .empty {
        text-align: center;

        color: #64748b;

        padding: 30px;
      }

      /* Footer */

      footer {
        text-align: center;

        margin-top: 30px;

        padding: 20px;

        color: #64748b;

        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- Header -->

    <header>
      <h1>Hybrid Attendance System</h1>

      <span> Face + Device Verification </span>
    </header>

    <!-- Main -->

    <main class="container">
      <!-- Summary Cards -->

      <section class="cards">
        <div class="card">
          <h3>Total Attendance</h3>

          <p id="totalAttendance">0</p>
        </div>

        <div class="card">
          <h3>Student</h3>

          <p id="studentName">—</p>
        </div>

        <div class="card">
          <h3>Face Verification</h3>

          <p class="verified">✓ Verified</p>
        </div>

        <div class="card">
          <h3>Device Verification</h3>

          <p class="verified">✓ Verified</p>
        </div>
      </section>

      <!-- Attendance History -->

      <section class="table-container">
        <h2>Attendance History</h2>

        <table>
          <thead>
            <tr>
              <th>Student</th>

              <th>Date</th>

              <th>Time</th>

              <th>Face</th>

              <th>Device</th>

              <th>Status</th>
            </tr>
          </thead>

          <tbody id="attendanceTable">
            <tr>
              <td colspan="6" class="empty">Loading attendance...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer>Hybrid Attendance System © 2026</footer>

    <!-- JavaScript -->

    <script>
      async function loadAttendance() {
        try {
          const response = await fetch("/api/attendance");

          const records = await response.json();

          const table = document.getElementById("attendanceTable");

          const total = document.getElementById("totalAttendance");

          const student = document.getElementById("studentName");

          total.textContent = records.length;

          if (records.length === 0) {
            table.innerHTML = `
                        <tr>
                            <td colspan="6"
                                class="empty">
                                No attendance records found.
                            </td>
                        </tr>
                    `;

            return;
          }

          student.textContent = records[0].student_name;

          table.innerHTML = "";

          records.forEach((record) => {
            const row = document.createElement("tr");

            row.innerHTML = `

                        <td>
                            ${record.student_name}
                        </td>

                        <td>
                            ${record.date}
                        </td>

                        <td>
                            ${record.time}
                        </td>

                        <td>
                            ${record.face_verified ? "✓" : "✗"}
                        </td>

                        <td>
                            ${record.device_verified ? "✓" : "✗"}
                        </td>

                        <td class="status">
                            ${record.status}
                        </td>

                    `;

            table.appendChild(row);
          });
        } catch (error) {
          console.error("Could not load attendance:", error);
        }
      }

      // Load attendance when page opens

      loadAttendance();

      // Refresh every 5 seconds

      setInterval(loadAttendance, 5000);
    </script>
  </body>
</html>
